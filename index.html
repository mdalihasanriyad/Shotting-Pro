<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deadshot 3D FPS - Humanoids & Jumping</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="hud">
        <div id="crosshair"></div>
        <div id="score-board">KILLS: <span id="kills">0</span></div>
        <div id="kill-feed"></div>
        <div id="health-bar-container"><div id="health-bar"></div></div>
        <div id="ammo-display"><span id="ammo">30</span><span> / 30</span></div>
    </div>

    <div id="overlay">
        <h1 id="title">DEADSHOT.IO CLONE</h1>
        <p>WASD = Move | Space = Jump | Left Click = Shoot | Right Click = Scope | R = Reload</p>
        <div class="btn">Click to Deploy</div>
    </div>

    <!-- Three.js Library -->
    <script src="https://unpkg.com/three@0.152.2/build/three.min.js"></script>
    <script src="game.js"></script>
</body>
</html>
