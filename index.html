<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deadshot 3D FPS - Cyber Arena Survival</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="damage-overlay"></div>

    <div id="hud">
        <div id="crosshair"></div>
        <div id="sniper-scope"></div>

        <div id="score-board">
            <div>WAVE: <span id="wave-num">1</span></div>
            <div>KILLS: <span id="kills">0</span></div>
        </div>
        <div id="weapon-display">WEAPON: <span id="weapon-name">RIFLE [1]</span></div>
        <div id="kill-feed"></div>
        
        <div id="health-bar-container">
            <div id="health-bar"></div>
            <span id="health-text">100 HP</span>
        </div>
        <div id="ammo-display"><span id="ammo">30</span><span id="max-ammo"> / 30</span></div>

        <!-- Minimap Radar -->
        <canvas id="minimap" width="140" height="140"></canvas>
    </div>

    <div id="overlay">
        <h1 id="title">DEADSHOT: CYBER ARENA SURVIVAL</h1>
        <p>WASD = Move | Shift = Sprint | C / Ctrl = Slide | Space = Jump<br>
           1, 2, 3 = Switch Weapons (Rifle, Sniper, Shotgun)<br>
           Left Click = Shoot | Right Click = Scope | R = Reload</p>
        <div class="btn">Click to Play</div>
    </div>

    <!-- Three.js Library -->
    <script src="https://unpkg.com/three@0.152.2/build/three.min.js"></script>
    <script src="game.js"></script>
</body>
</html>
